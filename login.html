<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вхід до акаунту — Риболов</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="cart.css">
  </head>
  <body class="login-page">
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="Рибацюга — головна"><span class="brand-mark"><img src="assets/logo-120.png" width="120" height="120" alt=""></span><span><strong>Рибацюга</strong><small>Каталог виробів для рибалок</small></span></a>
        <form class="header-search" action="catalog.html">
          <input name="q" type="search" placeholder="Пошук товару..." aria-label="Пошук товару">
          <button class="search-button" type="submit">Пошук</button>
        </form>
        <nav class="top-nav" aria-label="Основна навігація">
          <a class="nav-pill" href="catalog.html">Каталог</a>
          <a class="nav-plain" href="about.html" aria-current="page">Про нас</a>
          <a class="nav-icon" href="login.html"><img src="assets/user.png" alt="">Акаунт</a>
          <a class="nav-icon" href="cart.html"><img src="assets/cart.png" alt="">Кошик</a>
        </nav>
      </div>
    </header>
    <main class="login-main">
      <section class="login-card surface" aria-labelledby="login-title">
        <h1 id="login-title">Вхід до акаунту</h1>
        <p>Поверніться до свого каталогу, замовлень та персональних пропозицій.</p>
        <form action="account.html">
          <label for="phone">Телефон</label>
          <div class="phone-entry">
            <span>+38</span>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="Введіть номер" required="">
          </div>
          <label for="password">Пароль</label>
          <div class="password-entry"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Введіть пароль" required=""></div>
          <div class="login-options"><label><input type="checkbox" checked="checked"> Запам’ятати мене</label><a href="contacts.html">Забули пароль?</a></div>
          <button class="btn" type="submit">Увійти</button>
        </form>
        <div class="signup-prompt">Немає акаунту? <a href="contacts.html">Зареєструйтесь</a></div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <div><strong>Риболов</strong><small>Каталог виробів для рибалок · 2026</small></div>
        <nav class="footer-links" aria-label="Навігація в підвалі">
          <a href="catalog.html">Каталог</a>
          <a href="about.html">Про нас</a>
          <a href="contacts.html">Доставка</a>
          <a href="contacts.html">Контакти</a>
        </nav>
      </div>
    </footer>
    <script src="cart.js"></script>
  </body>
</html>
